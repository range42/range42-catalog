---
- name: ensure rocketchat deploy directory exists
  ansible.builtin.file:
    path: "{{ rocketchat_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0750"

- name: write rocketchat .env with custom OAuth (Gitea) settings
  ansible.builtin.template:
    src: rocketchat.env.j2
    dest: "{{ rocketchat_deploy_dir }}/.env"
    owner: "{{ ansible_user }}"
    mode: "0600"
