---
# software.install.rocketchat — deploy the Rocket.Chat docker-compose stack.
#
# The stack itself lives in the catalog at
#   03_container_layer/docker/admin/rocketchat/
# (Rocket.Chat + MongoDB replica set + provisioner). This role rsyncs that
# directory onto the target box and brings it up via docker compose, reusing the
# shared software.configure.docker-compose role.

# Controller-side source: resolved from the workspace RANGE42_INVENTORY env var
# (exported by range42-context). Mirrors how CTF stacks resolve
# RANGE42_INVENTORY__DOCKER__CTF at deploy time.
ROCKETCHAT_LOCAL_PROJECT_DIR: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/rocketchat"

# Where the stack is staged + run on the target box.
ROCKETCHAT_REMOTE_PROJECT_DIR: "/opt/range42/rocketchat"

# Owner of the staged files on the box: the scenario cloud-init admin user.
# Matches the canonical OPERATOR_USER wiring (no fallback — fail loudly if the
# scenario never set it, rather than silently chown to a user that may not exist).
ROCKETCHAT_OPERATOR_USER: "{{ default_admin_vm_ci_user }}"

# Container name docker-compose polls for after `up` — matches compose.yml.
ROCKETCHAT_CONTAINER_NAME: "rocketchat"

# Label only; admin service (not a CTF target).
ROCKETCHAT_LABEL_PROJECT_TYPE: "admin"
