---
##
## software.install.rocketchat
##
## Deploys the catalog Rocket.Chat docker-compose stack onto the target box by
## delegating to the shared software.configure.docker-compose role. Assumes the
## Docker engine + compose plugin are already present (wire
## software.install.warmup.basic_packages with INSTALL_PACKAGES_DOCKER first).
##

- name: DEPLOY - rocket.chat docker-compose stack
  ansible.builtin.include_role:
    name: software.configure.docker-compose
  vars:
    LOCAL__PROJECT_DIR: "{{ ROCKETCHAT_LOCAL_PROJECT_DIR }}"
    REMOTE_PROJECT_DIR: "{{ ROCKETCHAT_REMOTE_PROJECT_DIR }}"
    OPERATOR_USER: "{{ ROCKETCHAT_OPERATOR_USER }}"
    LABEL_PROJECT_TYPE: "{{ ROCKETCHAT_LABEL_PROJECT_TYPE }}"
    LABEL_PROJET_NAME: "{{ ROCKETCHAT_CONTAINER_NAME }}"
    SEND_POC_DIR: "NO"
    CLEAN_UP_DEPLOY_DIR: "NO"

