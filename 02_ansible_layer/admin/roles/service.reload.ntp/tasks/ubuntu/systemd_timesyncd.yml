---
#

- name: install ntp package - remove chrony or ntp to avoid conflicts then enable systemd-timesyncd
  block:
    #
    - name: remove ntp and ntpdate if present
      apt:
        name:
          - ntp
          - ntpdate
        state: absent

    #
    - name: check systemd-timesyncd is installed - ubuntu
      apt:
        name: systemd-timesyncd
        state: present

    #
    - name: enable and start systemd-timesyncd - ubuntu
      systemd:
        name: systemd-timesyncd
        enabled: true
        state: started

  when: ansible_facts.distribution == 'Ubuntu'

#
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#

- name: install ntp package - time sync - time is now !

  block:
    #
    - name: wait time drift - ubuntu
      command: timedatectl show -p NTPSynchronized --value
      register: ntp_sync_check
      until: ntp_sync_check.stdout == "yes"
      retries: 10
      delay: 5
      changed_when: false
      # Non-fatal: on isolated lab networks NTP may be unreachable (range42-catalog#208).
      # The clock is normally already correct (host/cloud-init), so don't abort the deploy.
      ignore_errors: true

    #
    - name: assert - time is sync - ubuntu
      debug:
        msg: >-
          {{ ' clock is sync !' if ntp_sync_check.stdout == 'yes'
             else 'WARNING clock not NTP-synchronized (NTPSynchronized='
                  ~ (ntp_sync_check.stdout | default('unknown'))
                  ~ ') - continuing anyway; ensure a reachable NTP server for production.' }}

  when: ansible_facts.distribution == 'Ubuntu'
