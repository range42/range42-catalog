- name: Optionally enroll an unknown guest public key through its PVE agent
  ansible.builtin.include_tasks: pve_agent_hostkey.yml
  when:
    - not ansible_check_mode
    - ansible_connection | default('ssh') != 'local'
    - range42_guest_hostkey_from_pve_agent | default(false) | bool

- name: WAIT FOR LOCAL INVENTORY CONNECTION
  ansible.builtin.wait_for_connection:
    timeout: 30
    sleep: 1
  when: ansible_connection | default('ssh') == 'local'

- name: WAIT FOR SSH - VIA ProxyJump
  ansible.builtin.command:
    # command parses quoted arguments into argv without invoking a shell.
    # Keep the CLI's first-use policy. API runners enable Ansible's existing
    # host-key checking flag; authenticated agent enrollment also requires
    # strict verification. Put policy first: OpenSSH uses the first option.
    cmd: >-
      ssh
      -o BatchMode=yes
      -o ConnectTimeout=5
      -o StrictHostKeyChecking={{ 'yes' if (lookup('env', 'ANSIBLE_HOST_KEY_CHECKING') | default(false, true) | bool or range42_guest_hostkey_from_pve_agent | default(false) | bool) else 'accept-new' }}
      -o {{ ('UserKnownHostsFile=' ~ (deployer_cli_user_ssh_known_hosts | to_json)) | quote }}
      {{ ansible_ssh_common_args | default('') }}
      {{ ansible_ssh_extra_args | default('') }}
      {{ ARG_vm_ssh_name | quote }} true
    expand_argument_vars: false

  register: ssh_check
  retries: 60
  delay: 5
  until: ssh_check.rc == 0
  changed_when: false
  delegate_to: localhost
  when: ansible_connection | default('ssh') != 'local'
