- name: CLOUD INIT - WAIT END OF SETUP
  ansible.builtin.wait_for:
    path: /var/lib/cloud/instance/boot-finished
    state: present
    delay: 10 # WAIT FOR 10seconds
    timeout: 500 # MAX 5 min
  when: ansible_shell_type | default('sh') != 'powershell'

# Windows clones : cloudbase-init plays the role of cloud-init. Its service stops by itself
# once every plugin has run (stop_service_on_exit in the template configuration). It may
# reboot the guest before that, so probe from the controller with plain ssh, like
# openssh_server/is_reachable.yml : a dropped connection is retried, not fatal. Two reads
# 15 s apart, so that a service stopped by a shutdown in progress does not count.
- name: CLOUD INIT - WAIT END OF SETUP (Windows, cloudbase-init service stopped)
  ansible.builtin.command:
    cmd: >-
      ssh
      -o BatchMode=yes
      -o ConnectTimeout=5
      -o StrictHostKeyChecking={{ 'yes' if (lookup('env', 'ANSIBLE_HOST_KEY_CHECKING') | default(false, true) | bool
      or range42_guest_hostkey_from_pve_agent | default(false) | bool) else 'accept-new' }}
      -o {{ ('UserKnownHostsFile=' ~ (deployer_cli_user_ssh_known_hosts | to_json)) | quote }}
      {{ ansible_ssh_common_args | default('') }}
      {{ ansible_ssh_extra_args | default('') }}
      {{ ARG_vm_ssh_name | quote }}
      "$a = (Get-Service cloudbase-init).Status ; Start-Sleep -Seconds 15 ; \"$a/$((Get-Service cloudbase-init).Status)\""
    expand_argument_vars: false
  register: cloudbase_init_status
  until: cloudbase_init_status.stdout | default('') | trim == 'Stopped/Stopped'
  retries: 60
  delay: 10
  failed_when: cloudbase_init_status.stdout | default('') | trim != 'Stopped/Stopped'
  changed_when: false
  delegate_to: localhost
  when: hostvars[inventory_hostname]['ansible_shell_type'] | default('sh') == 'powershell'
