---
# pykunai (one package) provides all the workshop tools : kunai-search,
# kunai-iocgen, misp-to-kunai, kunai-to-misp, kunai-graph. Installed as the
# operator user so the tools land in ~<user>/.local/bin.

# Driven by the pipx command, not by the community.general.pipx module : that
# module refuses any pipx below 1.7.0, and the pipx that apt installs on
# Ubuntu 24.04 is 1.4.3. The distribution pipx does the job. The `creates` guard
# keeps the task idempotent with the semantics the module had with state=present :
# install when absent, no reinstall on a version change. kunai-search is one of
# the six console scripts the package ships.
- name: kunai - install pykunai via pipx (as the operator user)
  ansible.builtin.command:
    cmd: "pipx install pykunai=={{ kunai_pykunai_version }}"
    creates: "/home/{{ kunai_operator_user }}/.local/bin/kunai-search"
  become: true
  become_user: "{{ kunai_operator_user }}"

# pipx installs to ~<user>/.local/bin, which is NOT on the interactive zsh PATH
# (the baseline dotfiles set an absolute PATH without it). Append it after that
# reset so the workshop commands (misp-to-kunai, kunai-search, ...) resolve.
- name: kunai - ensure ~/.local/bin is on the operator's interactive zsh PATH
  ansible.builtin.blockinfile:
    path: "/home/{{ kunai_operator_user }}/.zshrc"
    create: true
    owner: "{{ kunai_operator_user }}"
    group: "{{ kunai_operator_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED - kunai pykunai PATH"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
  become: true
