---
# software.install.kunai_official_workshop - default variables
#
# Resolves the KUNAI_* caller vars (passed by the thin bundle / scenario via
# import_playbook vars) into the role's working vars, with sane defaults so the
# role can also run standalone.

kunai_version: "{{ KUNAI_VERSION | default('v0.6.2') }}"
kunai_arch: "{{ KUNAI_ARCH | default('amd64') }}"
kunai_operator_user: "{{ KUNAI_OPERATOR_USER | default('alice') }}"
kunai_pykunai_version: "{{ KUNAI_PYKUNAI_VERSION | default('0.1.10') }}"
kunai_misp_local_enable: "{{ KUNAI_MISP_LOCAL_ENABLE | default(false) }}"
kunai_misp_url: "{{ KUNAI_MISP_URL | default('') }}"
kunai_misp_key: "{{ KUNAI_MISP_KEY | default('') }}"
kunai_gpg_fingerprint: "C0F6E8F2C1AB2799A31F416C0548A778D21D10AD"
kunai_gpg_keyserver: "hkps://keys.openpgp.org"
