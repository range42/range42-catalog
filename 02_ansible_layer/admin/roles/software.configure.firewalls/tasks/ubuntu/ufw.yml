---
- name: Install UFW
  ansible.builtin.package:
    name: ufw
    state: present

# This role replaces the guest baseline. Reset disables UFW, so stage the
# requested access rules before either restricting the policy or enabling it.
- name: Reset the previous guest firewall rules
  community.general.ufw:
    state: reset

- name: Install the requested guest access rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.protocol }}"
    from_ip: "{{ item.ip if item.ip != 'all' else 'any' }}"
  loop: "{{ firewall_rules }}"

- name: Deny incoming traffic without an access rule
  community.general.ufw:
    default: deny
    direction: incoming

- name: Enable the completed guest firewall policy
  community.general.ufw:
    state: enabled

- name: Read the active guest firewall rules
  ansible.builtin.command:
    cmd: ufw status verbose
  changed_when: false
  register: out

- name: Show the active guest firewall rules
  ansible.builtin.debug:
    var: out.stdout_lines
