---
- name: Install firewalld
  ansible.builtin.package:
    name: firewalld
    state: present

# Support both a running daemon and first activation without a window in which
# its public zone rejects the management connection.
- name: Preserve SSH before starting or restricting firewalld
  ansible.posix.firewalld:
    service: ssh
    zone: public
    state: enabled
    permanent: true
    immediate: true
    offline: true
  register: firewall_ssh

- name: Install the requested guest access rules
  ansible.posix.firewalld:
    zone: public
    permanent: true
    state: enabled
    immediate: true
    offline: true
    rich_rule: >-
      rule family=ipv4{% if item.ip != 'all' %} source address={{ item.ip }}{% endif %}
      port port={{ item.port }} protocol={{ item.protocol }} accept
  loop: "{{ firewall_rules }}"
  register: firewall_access

- name: Deny incoming traffic without an access rule
  ansible.posix.firewalld:
    zone: public
    target: DROP
    state: present
    permanent: true
    offline: true
  register: firewall_policy

- name: Start firewalld with the completed permanent policy
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Reload firewalld after a policy change
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  when: firewall_ssh.changed or firewall_access.changed or firewall_policy.changed

- name: Read the active guest firewall rules
  ansible.builtin.command:
    cmd: firewall-cmd --list-all
  changed_when: false
  register: out

- name: Show the active guest firewall rules
  ansible.builtin.debug:
    var: out.stdout_lines
