---

- name: serve mirror - write nginx apt-mirror config
  ansible.builtin.template:
    src: nginx-aptmirror.conf.j2
    dest: /etc/nginx/conf.d/apt-mirror.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart nginx

- name: serve mirror - disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: restart nginx

- name: serve mirror - enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: serve mirror - check ufw status
  ansible.builtin.command: ufw status
  register: _ufw_status_mirror
  changed_when: false
  failed_when: false
  become: true

- name: serve mirror - open port {{ apt_mirror_http_port }}/tcp
  community.general.ufw:
    rule: allow
    port: "{{ apt_mirror_http_port | string }}"
    proto: tcp
  become: true
  when:
    - _ufw_status_mirror.rc == 0
    - "'inactive' not in _ufw_status_mirror.stdout"
