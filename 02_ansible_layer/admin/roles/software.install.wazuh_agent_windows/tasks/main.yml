---
# software.install.wazuh_agent_windows
# Install the Wazuh agent on a Windows host from the pinned MSI, enroll it on WAZUH_MANAGER, and
# keep the service WazuhSvc running with start type automatic. No become, no fact gathering.
# Each task compares with the current state first (file checksum, installed ProductCode, service).

## The values end up on the msiexec command line : only plain names and addresses pass.
- name: WAZUH AGENT WINDOWS - assert the public variables
  ansible.builtin.assert:
    that:
      - WAZUH_MANAGER is string
      - WAZUH_MANAGER is match('^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$')
      - WAZUH_REGISTRATION_SERVER is string
      - WAZUH_REGISTRATION_SERVER == '' or WAZUH_REGISTRATION_SERVER is match('^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$')
      - WAZUH_AGENT_NAME is string
      - WAZUH_AGENT_NAME is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
      - WAZUH_AGENT_MSI_URL is match('^https://[^\s"]+/[A-Za-z0-9._-]+[.]msi$')
      - WAZUH_AGENT_MSI_SHA256 is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      WAZUH_MANAGER and WAZUH_REGISTRATION_SERVER must be an IPv4 address or a DNS name,
      WAZUH_AGENT_NAME letters, digits, '.', '_' or '-' (at most 128), WAZUH_AGENT_MSI_URL an
      https URL of a .msi file, WAZUH_AGENT_MSI_SHA256 a SHA-256 in hexadecimal.
    quiet: true

## %TEMP% of the connection account, not C:\Windows\Temp : with the default ACL any local user can
## create a file in C:\Windows\Temp, own it, and replace its content between this check and the
## install.
## An existing file with the right checksum is not downloaded again.
- name: WAZUH AGENT WINDOWS - download the pinned MSI, checked against its SHA-256
  ansible.windows.win_get_url:
    url: "{{ WAZUH_AGENT_MSI_URL }}"
    dest: "%TEMP%\\{{ WAZUH_AGENT_MSI_URL | basename }}"
    checksum: "{{ WAZUH_AGENT_MSI_SHA256 }}"
    checksum_algorithm: sha256
  register: _wazuh_agent_msi

## The module reads the ProductCode from the local MSI : no install when that product is present.
## The properties apply at install time only : a later change of WAZUH_MANAGER does not reach an
## agent that is already installed.
- name: WAZUH AGENT WINDOWS - install the agent and enroll it
  ansible.windows.win_package:
    path: "{{ _wazuh_agent_msi.dest }}"
    arguments: >-
      WAZUH_MANAGER={{ WAZUH_MANAGER }}
      WAZUH_REGISTRATION_SERVER={{ WAZUH_REGISTRATION_SERVER or WAZUH_MANAGER }}
      WAZUH_AGENT_NAME={{ WAZUH_AGENT_NAME }}
    state: present

- name: WAZUH AGENT WINDOWS - the service WazuhSvc runs and starts automatically
  ansible.windows.win_service:
    name: WazuhSvc
    state: started
    start_mode: auto
