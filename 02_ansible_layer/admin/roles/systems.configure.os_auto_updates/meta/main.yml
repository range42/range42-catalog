galaxy_info:
  role_name: systems_configure_os_auto_updates
  namespace: range42
  author: range42
  description: Disable or enable the OS background auto-updater (apt-daily + unattended-upgrades on Debian/Ubuntu, dnf-automatic + PackageKit on Fedora) so it never holds the package lock during provisioning.
