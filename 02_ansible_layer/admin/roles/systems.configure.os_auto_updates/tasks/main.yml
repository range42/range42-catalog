---
# systems.configure.os_auto_updates
# Disable (default) or enable the OS background auto-updater so it never holds the
# package lock during provisioning. OS-branched : the per-distribution logic lives in
# ./<distro>/unattended_updates.yml. Idempotent. Run this BEFORE any package task ;
# stopping the units also releases a lock that is already held.
#
# Test status :
#   - Ubuntu : tested
#   - Debian : NOT yet tested (apt mechanism mirrors Ubuntu ; validate before relying on it)
#   - Fedora : NOT yet tested (dnf mechanism ; validate before relying on it)

- name: os_auto_updates - assert state
  ansible.builtin.assert:
    that:
      - (OS_AUTO_UPDATES_STATE | default('disabled')) in ['disabled', 'enabled']
    fail_msg: "OS_AUTO_UPDATES_STATE must be 'disabled' or 'enabled'"

- name: INCLUDE - disable unattended updates - ubuntu
  ansible.builtin.include_tasks: ./ubuntu/unattended_updates.yml
  when: ansible_facts['distribution'] == "Ubuntu"

- name: INCLUDE - disable unattended updates - debian
  ansible.builtin.include_tasks: ./debian/unattended_updates.yml
  when: ansible_facts['distribution'] == "Debian"

- name: INCLUDE - disable unattended updates - fedora
  ansible.builtin.include_tasks: ./fedora/unattended_updates.yml
  when: ansible_facts['distribution'] == "Fedora"
