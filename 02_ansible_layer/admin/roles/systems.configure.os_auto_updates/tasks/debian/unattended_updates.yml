---
# os_auto_updates - Debian (apt).
# ############################################################################
# # NOT YET TESTED ON DEBIAN (no test environment available).                #
# # The apt mechanism is identical to Ubuntu (apt-daily timers +             #
# # unattended-upgrades) ; validate on a real Debian VM before relying on it.#
# ############################################################################
# disabled -> stop + disable + mask apt-daily{,.upgrade} timers/services +
#             unattended-upgrades.service, write 20auto-upgrades with keys at "0".
# enabled  -> unmask + enable + start the timers + unattended-upgrades, config back to daily.

- name: os_auto_updates (debian) - stop + disable + mask apt units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ _os_auto_updates_apt_units }}"
  register: _oau_disable
  when: (OS_AUTO_UPDATES_STATE | default('disabled')) == 'disabled'
  failed_when:
    - _oau_disable is failed
    - "'Could not find' not in (_oau_disable.msg | default(''))"
    - "'not loaded' not in (_oau_disable.msg | default(''))"

- name: os_auto_updates (debian) - write periodic config (all off)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // range42 - OS background auto-updates disabled during provisioning
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
  when: (OS_AUTO_UPDATES_STATE | default('disabled')) == 'disabled'

- name: os_auto_updates (debian) - unmask + enable + start apt units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
    enabled: true
    state: started
  loop: "{{ _os_auto_updates_apt_enable_units }}"
  register: _oau_enable
  when: (OS_AUTO_UPDATES_STATE | default('disabled')) == 'enabled'
  failed_when:
    - _oau_enable is failed
    - "'Could not find' not in (_oau_enable.msg | default(''))"
    - "'not loaded' not in (_oau_enable.msg | default(''))"

- name: os_auto_updates (debian) - write periodic config (daily)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  when: (OS_AUTO_UPDATES_STATE | default('disabled')) == 'enabled'
