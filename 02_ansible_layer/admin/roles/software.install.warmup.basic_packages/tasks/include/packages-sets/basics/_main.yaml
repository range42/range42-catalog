- name: install - basics packages - block
  block:
    #
    - name: INCLUDE - install - basics packages - debian-based
      ansible.builtin.include_tasks: ./debian-based/packages_basics.yaml
      when: ansible_facts.distribution in ['Ubuntu', 'Debian']
    #
    - name: INCLUDE - install - basics packages - fedora
      ansible.builtin.include_tasks: ./fedora/packages_basics.yaml
      when: ansible_facts.distribution == 'Fedora'

  when: (INSTALL_PACKAGES_BASICS | default('no') | string | lower) in ['yes', 'true']
  # when: INSTALL_PACKAGES_BASICS | default('NO') == 'YES'

