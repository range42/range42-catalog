id: apt-mirror-airgapped
api_version: 1
description: >-
  Full offline apt mirror (apt-mirror + nginx, port 80). Downloads and serves complete
  Debian trixie package sets locally — no upstream internet access required after sync.
  Set apt_mirror_prewarm: true to trigger an initial mirror sync on deploy.
template_vm: "template-vm-debian-trixie-large"
default_attachments:
  - kind: role
    catalog_ref: software.configure.firewalls
    params:
      firewall_rules:
        - {ip: "all", port: 22, protocol: "tcp"}   # ssh
        - {ip: "all", port: 80, protocol: "tcp"}   # nginx apt mirror
  - {kind: role, catalog_ref: software.install.warmup.basic_packages, params: {}}
  - kind: role
    catalog_ref: software.install.apt_cacher_ng
    params:
      apt_mirror_airgapped: true
      apt_mirror_http_port: 80
      apt_mirror_root: /var/spool/apt-mirror
      apt_mirror_threads: 20
      apt_mirror_prewarm: false
      apt_mirror_debian_stable: true
      apt_mirror_security: true
      apt_mirror_backports: false
      apt_mirror_ubuntu_2204: false
      apt_mirror_ubuntu_2404: false
