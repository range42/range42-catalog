id: apt-cache
api_version: 1
description: >-
  apt-cacher-ng transparent caching proxy (port 3142). Caches downloaded packages on first
  fetch — subsequent installs across the lab are served locally without re-downloading.
template_vm: "template-vm-debian-trixie-small"
default_attachments:
  - kind: role
    catalog_ref: software.configure.firewalls
    params:
      firewall_rules:
        - {ip: "all", port: 22, protocol: "tcp"}    # ssh
        - {ip: "all", port: 3142, protocol: "tcp"}  # apt-cacher-ng
  - {kind: role, catalog_ref: software.install.warmup.basic_packages, params: {}}
  - {kind: role, catalog_ref: software.install.apt_cacher_ng, params: {}}
