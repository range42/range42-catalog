id: apt-mirror
api_version: 1
description: Local apt mirror served via nginx. Configure which distros and suites to mirror via params.
template_vm: "template-vm-debian-trixie-large"
default_attachments:
  - kind: role
    catalog_ref: software.configure.firewalls
    params:
      firewall_rules:
        - {ip: "all", port: 22, protocol: "tcp"}   # ssh
        - {ip: "all", port: 80, protocol: "tcp"}   # nginx apt mirror
  - {kind: role, catalog_ref: software.install.warmup.basic_packages, params: {}}
  - kind: role
    catalog_ref: software.install.apt_mirror
    params:
      # Suites
      apt_mirror_debian_bookworm: false
      apt_mirror_debian_trixie: true
      apt_mirror_ubuntu_jammy: false
      apt_mirror_ubuntu_noble: false
      apt_mirror_ubuntu_resolute: false
      apt_mirror_security: true
      apt_mirror_backports: false
      apt_mirror_include_sources: false
      apt_mirror_ubuntu_components: "main restricted"
      # Behaviour
      apt_mirror_prewarm: true
      apt_mirror_threads: 20
      # Storage / network
      apt_mirror_http_port: 80
      apt_mirror_root: /var/spool/apt-mirror
