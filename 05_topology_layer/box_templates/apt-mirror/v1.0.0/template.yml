id: apt-mirror
api_version: 1
description: >-
  Dual-mode apt server: proxy-cache (apt-cacher-ng, port 3142, default) or full airgapped
  mirror (apt-mirror + nginx, port 80). Set apt_mirror_airgapped: true to enable offline mode.
template_vm: "template-vm-debian-trixie-small"
default_attachments:
  - kind: role
    catalog_ref: software.configure.firewalls
    params:
      firewall_rules:
        - {ip: "all", port: 22, protocol: "tcp"}    # ssh
        - {ip: "all", port: 3142, protocol: "tcp"}  # apt-cacher-ng (proxy mode)
        - {ip: "all", port: 80, protocol: "tcp"}    # nginx (airgapped mirror mode)
  - {kind: role, catalog_ref: software.install.warmup.basic_packages, params: {}}
  - {kind: role, catalog_ref: software.install.apt_cacher_ng, params: {}}
