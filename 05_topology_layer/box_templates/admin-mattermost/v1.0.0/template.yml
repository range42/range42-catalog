id: admin-mattermost
api_version: 1
description: >-
  Mattermost admin box on Debian — provisions the Docker baseline, opens the
  service port, and bootstraps the Mattermost compose stack (Mattermost Team
  Edition + PostgreSQL + provisioner) from
  03_container_layer/docker/admin/mattermost via software.install.mattermost.
template_vm: "template-vm-debian-trixie-medium"
default_attachments:
  - kind: role
    catalog_ref: software.configure.firewalls
    params:
      firewall_rules:
        - {ip: "all", port: 22, protocol: "tcp"}
        - {ip: "all", port: 8065, protocol: "tcp"}   # mattermost web ui
  - kind: role
    catalog_ref: software.install.warmup.basic_packages
    params:
      INSTALL_PACKAGES_BASICS: "YES"
      INSTALL_PACKAGES_DOCKER: "YES"
      INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
      INSTALL_PACKAGES_UTILS_JSON: "YES"
      INSTALL_PACKAGES_UTILS_NETWORK: "YES"
  - {kind: role, catalog_ref: software.install.mattermost, params: {}}
