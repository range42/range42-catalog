id: admin-wazuh
api_version: 1
description: Wazuh SIEM admin box (indexer + manager + dashboard).
role: admin
template_vm: "template-vm-ubuntu-noble-medium-04-8g-64g"
default_inventory_group: r42_admin_group
default_attachments:
  - kind: role
    catalog_ref: software.configure.firewalls
    params:
      firewall_rules:
        - {ip: "all", port: 22, protocol: "tcp"}    # ssh
        - {ip: "all", port: 443, protocol: "tcp"}   # dashboard
        - {ip: "all", port: 1514, protocol: "tcp"}  # wazuh agent events
        - {ip: "all", port: 1515, protocol: "tcp"}  # wazuh agent enrollment
  - {kind: role, catalog_ref: software.install.wazuh, params: {}}
