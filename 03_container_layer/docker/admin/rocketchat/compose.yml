services:

  mongodb:
    image: mongo:8.0
    container_name: rocketchat-mongodb
    command: mongod --replSet rs0 --oplogSize 128
    volumes:
      - rocketchat-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { 0 }"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mongo-init-replica:
    image: mongo:8.0
    container_name: rocketchat-mongo-init
    command: >
      bash -c "
        until mongosh mongodb:27017/admin --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1; do sleep 2; done;
        mongosh mongodb:27017/admin --eval '
          try { rs.status().ok } catch(e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb:27017\" }] })
          }';
        until mongosh mongodb:27017/admin --eval 'rs.isMaster().ismaster' 2>/dev/null | grep -q true; do sleep 2; done;
        echo \"Replica set PRIMARY ready\"
      "
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  rocketchat: &main
    image: rocketchat/rocket.chat:latest
    container_name: rocketchat
    environment:
      MONGO_URL:      "mongodb://mongodb:27017/rocketchat?replicaSet=rs0"
      MONGO_OPLOG_URL: "mongodb://mongodb:27017/local?replicaSet=rs0"
      ROOT_URL:       ${RC_BASE_URL:-http://localhost:3000}
      PORT:           "3000"
      DEPLOY_PLATFORM: docker
      ADMIN_USERNAME: ${RC_ADMIN_USER:-admin}
      ADMIN_PASS:     ${RC_ADMIN_PASS:-Admin1234!}
      ADMIN_EMAIL:    ${RC_ADMIN_EMAIL:-admin@range42.local}
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
    volumes:
      - rocketchat-uploads:/app/uploads
    ports:
      - "${HTTP_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    healthcheck:
      # The rocket.chat image ships Node (it runs `node main.js`) but NOT curl,
      # so a curl-based probe never passes and the container is stuck
      # "health: starting" forever (blocking the provisioner via depends_on).
      # Use Node's built-in fetch (Node 18+) to hit the info endpoint instead.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped
#
# #### #### do not remove.
#
#   debug:
#     <<: *main
#     container_name: rocketchat-debug
#     command: ["sleep", "infinity"]

  provisioner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rocketchat-provisioner
    env_file: .env
    environment:
      RC_URL: http://rocketchat:3000
    volumes:
      - rocketchat-tokens:/tokens
      - ./provisioning/provision.sh:/provisioning/provision.sh:ro
      - ./provisioning/provision-users.sh:/provisioning/provision-users.sh:ro
      - ./provisioning/provision-tokens.sh:/provisioning/provision-tokens.sh:ro
    depends_on:
      rocketchat:
        condition: service_healthy
    restart: "no"

volumes:
  rocketchat-mongodb-data:
  rocketchat-uploads:
  rocketchat-tokens:
