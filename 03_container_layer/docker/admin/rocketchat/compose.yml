services:

  mongodb:
    image: mongo:8.0
    container_name: rocketchat-mongodb
    command: mongod --replSet rs0 --oplogSize 128
    volumes:
      - rocketchat-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { 0 }"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mongo-init-replica:
    image: mongo:8.0
    container_name: rocketchat-mongo-init
    command: >
      bash -c "
        until mongosh mongodb:27017/admin --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1; do sleep 2; done;
        mongosh mongodb:27017/admin --eval '
          try { rs.status().ok } catch(e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb:27017\" }] })
          }';
        until mongosh mongodb:27017/admin --eval 'rs.hello().isWritablePrimary' 2>/dev/null | grep -q true; do sleep 2; done;
        echo \"Replica set PRIMARY ready\"
      "
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  rocketchat: &main
    image: rocketchat/rocket.chat:latest
    container_name: rocketchat
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL:      "mongodb://mongodb:27017/rocketchat?replicaSet=rs0"
      MONGO_OPLOG_URL: "mongodb://mongodb:27017/local?replicaSet=rs0"
      ROOT_URL:       ${RC_BASE_URL:-http://localhost:3000}
      PORT:           "3000"
      DEPLOY_PLATFORM: docker
      ADMIN_USERNAME: ${RC_ADMIN_USER:-rc-admin}
      ADMIN_PASS:     ${RC_ADMIN_PASS:-Admin1234!}
      ADMIN_EMAIL:    ${RC_ADMIN_EMAIL:-admin@range42.local}
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
    volumes:
      - rocketchat-uploads:/app/uploads
      - /home/alice/certs/gitea.crt:/certs/gitea.crt:ro
    ports:
      - "${HTTP_PORT:-3500}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped
#
# #### #### do not remove.
#
#   debug:
#     <<: *main
#     container_name: rocketchat-debug
#     command: ["sleep", "infinity"]

  provisioner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rocketchat-provisioner
    environment:
      RC_URL:        http://rocketchat:3000
      RC_ADMIN_USER: ${RC_ADMIN_USER:-rc-admin}
      RC_ADMIN_PASS: ${RC_ADMIN_PASS:-Admin1234!}
      USERS_FILE:    /provisioning/users.yml
      # Gitea self-registration — provisioner registers RC as an OAuth2 app and
      # configures the Custom OAuth2 provider. Leave GITEA_URL blank to skip.
      GITEA_URL:         "${GITEA_BASE_URL:-}"
      GITEA_ADMIN_USER:  "${GITEA_ADMIN_USER:-gitea-admin}"
      GITEA_ADMIN_PASS:  "${GITEA_ADMIN_PASS:-}"
      RC_BASE_URL:       "${RC_BASE_URL:-http://localhost:3500}"
      # Optional: pre-supply credentials to skip the self-registration step.
      RC_GITEA_CLIENT_ID:     "${RC_GITEA_CLIENT_ID:-}"
      RC_GITEA_CLIENT_SECRET: "${RC_GITEA_CLIENT_SECRET:-}"
    volumes:
      - rocketchat-tokens:/tokens
    depends_on:
      rocketchat:
        condition: service_healthy
    restart: "no"

volumes:
  rocketchat-mongodb-data:
  rocketchat-uploads:
  rocketchat-tokens:
