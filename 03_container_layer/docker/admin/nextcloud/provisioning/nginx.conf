map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Nextcloud file uploads
    client_max_body_size 1G;
    proxy_read_timeout   600s;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_buffering         off;
    proxy_request_buffering off;

    # Collabora Online CODE — path-based routing on the same port as Nextcloud.
    # Routing via a separate port (9443) required a second TLS certificate
    # exception in the browser. By proxying Collabora paths here the browser
    # only ever needs to accept one certificate origin (this server block).
    #
    # Paths used by the Collabora CODE / cool rebranding:
    #   /browser/  — static editor assets (HTML, JS, CSS)
    #   /cool/     — main HTTP + WebSocket endpoint (formerly /lool/)
    #   /hosting/  — WOPI discovery XML and capabilities
    #   /lool/     — legacy alias kept for in-flight WebSocket upgrades
    location ~ ^/(browser|cool|lool|hosting)(/|$) {
        proxy_pass         http://collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $http_host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Collabora uses long-lived WebSocket frames during document editing
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location / {
        proxy_pass http://nextcloud:80;
    }
}
