[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

# XML-RPC endpoint MISP uses to manage its background workers.
# Credentials come from the environment set by entrypoint.sh.
[inet_http_server]
port=127.0.0.1:9001
username=%(ENV_SUPERVISOR_USER)s
password=%(ENV_SUPERVISOR_PASSWORD)s

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# MISP background workers, one program per queue, all as www-data.
# Program names must be the bare queue names: MISP reads the supervisor
# process name as the queue name.
[group:misp-workers]
programs=default,email,cache,prio,update,scheduler

[program:default]
command=/var/www/MISP/app/Console/cake start_worker default
directory=/var/www/MISP
user=www-data
autostart=true
autorestart=true
startretries=10
stopwaitsecs=15
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

