##
## catalog_try contract - MISP (standalone Docker, full stack)
##
## Used by `range42-context catalog-try docker/admin/misp-standalone` to apply
## a stricter smoke check (L2 HTTPS poll on /users/login on port 443) instead
## of the default L1 fallback (docker ps -a presence).
##
## Port 443 is the externally-mapped HTTPS port (compose maps
## `${MISP_HTTPS_PORT:-443}:8443` on misp-nginx). Port 80 is also mapped but
## redirects to MISP_BASEURL, so the smoke check targets HTTPS directly. The
## `-k` (insecure) is implicit : misp-nginx serves a self-signed cert by default.
##
## init_timeout = 900s (15 min) : the stack pulls ~3.2 GB of pinned
## misp-docker images on a fresh VM, then MISP answers ~2 min after a cold
## start. Nothing is built on the VM.
##
## Endpoint /users/login returns HTTP 200 with the MISP login form as soon as
## misp-nginx is serving, which only happens once misp-core is healthy (its
## first-boot initialisation is done).
##
## See range42-playbooks/scenarios/catalog_try/catalog_try.element_deploy.yml
## for the playbook that consumes these fields.
##

catalog_try_mode: service
catalog_try_port:
  - 443    # HTTPS (web UI + API + login form)
catalog_try_endpoint: /users/login
catalog_try_init_timeout: 900
