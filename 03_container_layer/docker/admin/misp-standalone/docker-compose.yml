##
## MISP standalone — official misp-docker images (https://github.com/MISP/misp-docker)
## plus range42 provisioning (orgs, users, sharing groups, warning lists,
## taxonomies, sample events). Nothing is built on the host.
##

x-misp-core-image: &misp-core-image ghcr.io/misp/misp-docker/misp-core:${MISP_CORE_TAG:-v2.5.50}

services:

  # ── MariaDB ────────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_db_root_password}
      MYSQL_DATABASE:      ${MISP_DB_NAME:-misp}
      MYSQL_USER:          ${MISP_DB_USER:-misp}
      MYSQL_PASSWORD:      ${MISP_DB_PASSWORD:-changeme_db_password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Valkey (Redis) ─────────────────────────────────────────────────────────
  # Reachable only on the compose network, so it runs without a password.
  redis:
    image: valkey/valkey:7.2
    restart: unless-stopped
    command: valkey-server --save ""
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── misp-modules ──────────────────────────────────────────────────────────
  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:${MISP_MODULES_TAG:-v3.0.12}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/6666"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  # ── MISP core (PHP-FPM, workers, first-boot initialisation) ───────────────
  misp-core:
    image: *misp-core-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      misp-modules:
        condition: service_healthy
    healthcheck:
      # PHP-FPM only listens once initialisation and customize_misp.sh are done.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9002"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 600s
    volumes:
      - misp-config:/var/www/MISP/app/Config
      - misp-files:/var/www/MISP/app/files
      - misp-logs:/var/www/MISP/app/tmp/logs
      - misp-gnupg:/var/www/MISP/.gnupg
      - ./provisioning/customize_misp.sh:/custom/files/customize_misp.sh:ro
    environment:
      BASE_URL:                    ${MISP_BASEURL:-https://localhost}
      ADMIN_EMAIL:                 ${MISP_ADMIN_EMAIL:-admin@misp.local}
      ADMIN_PASSWORD:              ${MISP_ADMIN_PASSWORD:-Admin1234!XYZ}
      ADMIN_KEY:                   ${MISP_ADMIN_KEY:-changemechangemechangemechangemechangeme}
      ADMIN_ORG:                   ${MISP_ORG:-Default Organisation}
      SALT:                        ${MISP_SALT:-}
      DISABLE_PRINTING_PLAINTEXT_CREDENTIALS: "true"
      ENABLE_BACKGROUND_UPDATES:   "true"
      MYSQL_HOST:                  db
      MYSQL_PORT:                  "3306"
      MYSQL_DATABASE:              ${MISP_DB_NAME:-misp}
      MYSQL_USER:                  ${MISP_DB_USER:-misp}
      MYSQL_PASSWORD:              ${MISP_DB_PASSWORD:-changeme_db_password}
      REDIS_HOST:                  redis
      REDIS_PORT:                  "6379"
      ENABLE_REDIS_EMPTY_PASSWORD: "true"
      REDIS_PASSWORD:              ""
      TZ:                          ${TZ:-UTC}

  # ── TLS cert (one-shot) ────────────────────────────────────────────────────
  # Copies ./ssl/{cert,key}.pem when present, otherwise generates a self-signed
  # cert for the host in MISP_BASEURL.
  certgen:
    image: *misp-core-image
    entrypoint: ["/bin/bash", "/provisioning/generate-cert.sh"]
    environment:
      MISP_BASEURL: ${MISP_BASEURL:-https://localhost}
    volumes:
      - certs:/certs
      - ./ssl:/operator-certs:ro
      - ./provisioning/generate-cert.sh:/provisioning/generate-cert.sh:ro
    restart: "no"

  # ── nginx (TLS front for misp-core) ───────────────────────────────────────
  misp-nginx:
    image: ghcr.io/misp/misp-docker/misp-nginx:${MISP_CORE_TAG:-v2.5.50}
    restart: unless-stopped
    depends_on:
      misp-core:
        condition: service_healthy
      certgen:
        condition: service_completed_successfully
    ports:
      - "${MISP_HTTP_PORT:-80}:8080"
      - "${MISP_HTTPS_PORT:-443}:8443"
    volumes:
      - certs:/etc/nginx/certs:ro
    tmpfs:
      - /etc/nginx/conf.d:mode=0755,uid=101,gid=101
      - /var/cache/nginx:mode=0755,uid=101,gid=101
      - /tmp:mode=1777
    user: nginx
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BASE_URL:      ${MISP_BASEURL:-https://localhost}
      FASTCGI_LISTEN: misp-core:9002
      TZ:            ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "curl", "-sfk", "-o", "/dev/null", "https://localhost:8443/users/login"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Provisioner (one-shot) ─────────────────────────────────────────────────
  # Seeds orgs, users, sharing groups, warning lists, taxonomies and sample
  # events through the REST API, writes credentials to ./keys/, then exits.
  provisioner:
    image: *misp-core-image
    entrypoint: ["/bin/bash", "/provisioning/provision.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      MISP_URL:       https://misp-nginx:8443
      MISP_ADMIN_KEY: ${MISP_ADMIN_KEY:-changemechangemechangemechangemechangeme}
      MISP_VERSION:   ${MISP_CORE_TAG:-v2.5.50}
    volumes:
      - ./keys:/keys
      - ./provisioning:/provisioning:ro
    depends_on:
      misp-nginx:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  misp-config:
  misp-files:
  misp-logs:
  misp-gnupg:
  certs:
