; MISP runtime tuning — applied to both Apache and CLI PHP contexts.
; Warninglist / galaxy / taxonomy updates load many large JSON files in one
; request; 128 MB (PHP default) is not enough and causes fatal OOM errors.
memory_limit        = 512M
max_execution_time  = 300
upload_max_filesize = 50M
post_max_size       = 50M
