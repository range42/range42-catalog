# HTTP → HTTPS redirect (strip any port from Host header before redirecting)
<VirtualHost *:80>
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/MISP/app/webroot

    SSLEngine on
    SSLCertificateFile    /certs/misp.crt
    SSLCertificateKeyFile /certs/misp.key
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off

    <Directory /var/www/MISP/app/webroot>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ServerSignature Off

    LogLevel warn
    ErrorLog  ${APACHE_LOG_DIR}/misp_error.log
    CustomLog ${APACHE_LOG_DIR}/misp_access.log combined
</VirtualHost>
